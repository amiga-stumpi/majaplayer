server {
    listen 80;
    server_name mods.c64.social;

    root /var/www/amigamods;
    index index.txt;

    # Keep this AmigaOS 1.3 friendly: no HTTPS redirect and no gzip requirement.
    gzip off;

    location /api/ {
        default_type text/plain;
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # Optional: enable this when php-fpm is installed.
    # location = /api/random.php {
    #     include fastcgi_params;
    #     fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    #     fastcgi_pass unix:/run/php/php-fpm.sock;
    # }

    location /mods/ {
        default_type application/octet-stream;
        add_header Cache-Control "public, max-age=86400";
        try_files $uri =404;
    }

    location / {
        default_type text/plain;
        try_files $uri $uri/ /index.txt;
    }
}
